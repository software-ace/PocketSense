name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pre-cache pub dependencies
        run: flutter pub get

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # llama.cpp (via llamadart) ships prebuilt native libs for common ABIs,
      # so no NDK build step is needed here.
      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk "PocketSense-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: PocketSense-${GITHUB_REF_NAME}.apk
          generate_release_notes: true

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PocketSense-apk
          path: PocketSense-${GITHUB_REF_NAME:-main}.apk
