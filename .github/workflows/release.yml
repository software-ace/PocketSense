name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Repo default GITHUB_TOKEN is read-only; creating a release needs contents: write.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pre-cache pub dependencies
        run: flutter pub get

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # llama.cpp (via llamadart) ships prebuilt native libs for common ABIs,
      # so no NDK build step is needed here.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # All releases must share one signing key, or Android won't install an
      # update over the existing app. Tag builds refuse to fall back to debug.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
              exit 1
            fi
            echo "No release key configured; this manual build will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # On tags, the tag is the version (v1.2.0 → 1.2.0) and the run number is
      # the Android versionCode, so every release installs as an upgrade.
      # Manual runs fall back to pubspec.yaml's version.
      # --split-per-abi: one APK per CPU type, each about half the universal
      # size (most phones need arm64-v8a).
      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            flutter build apk --release --split-per-abi --build-name="${GITHUB_REF_NAME#v}" --build-number="${GITHUB_RUN_NUMBER}"
          else
            flutter build apk --release --split-per-abi
          fi

      # app-arm64-v8a-release.apk → PocketSense-v1.2.1-arm64-v8a.apk
      - name: Rename artifacts
        run: |
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            mv "$f" "dist/PocketSense-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -lh dist

      # Guard against a silently wrong key: the certificate must match the
      # release key's public fingerprint (safe to publish; it's in every APK).
      - name: Verify APK signatures
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_CERT_SHA256: 511ce20e8711c8d4001d9be45c8ec3b7c81969afdce062425b440f2abd6f0daa
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in dist/*.apk; do
            got=$("$apksigner" verify --print-certs "$f" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$f is signed with $got, expected $EXPECTED_CERT_SHA256"
              exit 1
            fi
            echo "OK  $f"
          done

      # A release for this tag may already exist (e.g. drafted by hand in the
      # GitHub UI before pushing the tag). Attach the APK to it instead of
      # failing; --clobber makes re-runs replace the asset.
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Pocket Sense ${GITHUB_REF_NAME}" \
              --generate-notes \
              dist/*.apk
          fi

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PocketSense-apks
          path: dist/*.apk
