name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Repo default GITHUB_TOKEN is read-only; creating a release needs contents: write.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Pre-cache pub dependencies
        run: flutter pub get

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      # llama.cpp (via llamadart) ships prebuilt native libs for common ABIs,
      # so no NDK build step is needed here.
      - name: Analyze
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Rename artifact
        run: mv build/app/outputs/flutter-apk/app-release.apk "PocketSense-${GITHUB_REF_NAME}.apk"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Pocket Sense ${GITHUB_REF_NAME}" \
            --notes "Built from tag ${GITHUB_REF_NAME}." \
            "PocketSense-${GITHUB_REF_NAME}.apk"

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PocketSense-apk
          path: PocketSense-${{ github.ref_name }}.apk
