name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

# Repo default GITHUB_TOKEN is read-only; creating a release needs contents: write.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Reproducible builds: F-Droid rebuilds each APK from the same commit and
      # publishes ours only if it matches byte for byte (apart from the
      # signature). Its recipe (fdroid/metadata/) mirrors everything here: this
      # checkout path, Java 21 (Debian's default), the Flutter version pinned
      # in pubspec.yaml, the pub cache inside the source tree, and the jni
      # patch below. Change one side, change the other.
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          pub-cache-path: ${{ github.workspace }}/.pub-cache

      # jni's native library otherwise gets a build ID hashed from paths that
      # differ between machines.
      - name: Get dependencies
        run: |
          flutter pub get --enforce-lockfile
          sed -i '/build-id=none/!s/-Wl,/-Wl,--build-id=none,/' .pub-cache/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # All releases must share one signing key, or Android won't install an
      # update over the existing app. Tag builds refuse to fall back to debug.
      - name: Set up release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing; refusing to publish a debug-signed release."
              exit 1
            fi
            echo "No release key configured; this manual build will be debug-signed."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # The version name and build number both come from pubspec.yaml, which is
      # also what F-Droid builds from, so both channels ship the same
      # versionCode. A tag must match it (v2.0.0 ↔ version: 2.0.0+N).
      # --split-per-abi: one APK per CPU type, each about half the universal
      # size (most phones need arm64-v8a). Each gets versionCode N × 10 + ABI
      # (android/app/build.gradle.kts), the scheme F-Droid asks for.
      - name: Check tag matches pubspec version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' pubspec.yaml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pubspec.yaml version $version"
            exit 1
          fi

      - name: Build release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi

      # app-arm64-v8a-release.apk → PocketSense-v1.2.1-arm64-v8a.apk
      - name: Rename artifacts
        run: |
          mkdir -p dist
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            mv "$f" "dist/PocketSense-${GITHUB_REF_NAME}-${abi}.apk"
          done
          ls -lh dist

      # Guard against a silently wrong key: the certificate must match the
      # release key's public fingerprint (safe to publish; it's in every APK).
      - name: Verify APK signatures
        if: startsWith(github.ref, 'refs/tags/')
        env:
          EXPECTED_CERT_SHA256: 511ce20e8711c8d4001d9be45c8ec3b7c81969afdce062425b440f2abd6f0daa
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          for f in dist/*.apk; do
            got=$("$apksigner" verify --print-certs "$f" | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
            if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
              echo "::error::$f is signed with $got, expected $EXPECTED_CERT_SHA256"
              exit 1
            fi
            echo "OK  $f"
          done

      # A release for this tag may already exist (e.g. drafted by hand in the
      # GitHub UI before pushing the tag). Attach the APK to it instead of
      # failing; --clobber makes re-runs replace the asset.
      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Hand-written notes live in .github/release-notes/<tag>.md; without
          # one, GitHub generates notes from the commits since the last tag.
          notes=".github/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.apk --clobber
            if [ -f "$notes" ]; then gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes"; fi
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Pocket Sense ${GITHUB_REF_NAME}" \
              "${notes_args[@]}" \
              dist/*.apk
          fi

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PocketSense-apks
          path: dist/*.apk

  # Runs after build-apk so it only ships code that passed analyze + test, and
  # so the release it attaches to already exists.
  build-linux:
    needs: build-apk
    # The oldest supported runner: the binary links against this glibc (2.35),
    # so building here lets it run on more distros than ubuntu-latest would.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml

      - name: Install Linux toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - name: Build Linux bundle
        run: flutter build linux --release

      # Pinned and checksummed: these tools end up shaping what users install.
      - name: Install packaging tools
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL -o nfpm.tar.gz https://github.com/goreleaser/nfpm/releases/download/v2.47.0/nfpm_2.47.0_Linux_x86_64.tar.gz
          echo "0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783  nfpm.tar.gz" | sha256sum -c
          tar -xzf nfpm.tar.gz -C "$RUNNER_TEMP/bin" nfpm
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  $RUNNER_TEMP/bin/appimagetool" | sha256sum -c
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Four ways to get the same bundle (engine, plugins and SQLCipher are in
      # bundle/lib):
      # - tarball: unpacks to PocketSense/; the user installs GTK 3 etc.
      # - .deb / .rpm: install to /opt/pocket-sense with a menu entry, and
      #   pull in GTK 3, libsecret and the GL libraries (linux/packaging/nfpm.yaml).
      # - AppImage: one executable file, using the system's GTK 3 and keyring.
      # Package versions come from pubspec.yaml, so manual runs from a branch work too.
      - name: Package
        run: |
          mkdir -p dist
          name="PocketSense-${GITHUB_REF_NAME}-linux-x64"
          version=$(sed -n 's/^version: *\([^+]*\)+.*/\1/p' pubspec.yaml)
          tar -C build/linux/x64/release -czf "dist/${name}.tar.gz" \
            --transform 's,^bundle,PocketSense,' bundle
          VERSION="$version" nfpm package -f linux/packaging/nfpm.yaml -p deb -t "dist/${name}.deb"
          VERSION="$version" nfpm package -f linux/packaging/nfpm.yaml -p rpm -t "dist/${name}.rpm"
          linux/packaging/build-appimage.sh "$version" "dist/${name}.AppImage"
          ls -lh dist

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/* --clobber

      - name: Upload artifact (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: PocketSense-linux
          path: dist/*
