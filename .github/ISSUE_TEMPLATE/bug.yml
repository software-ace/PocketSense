name: Bug report
description: Something doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Pocket Sense holds financial data, so **don't post amounts, backup files or real transactions** here. Describe them instead, or use made-up numbers.
        A security problem? Please don't open an issue: [report it privately](https://github.com/software-ace/PocketSense/security/advisories/new).
  - type: input
    id: version
    attributes:
      label: Pocket Sense version
      description: Settings → About
      placeholder: "2.2.8"
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: Installed from
      options:
        - F-Droid
        - GitHub APK
        - AppImage
        - .deb
        - .rpm
        - tar.gz
        - Built from source
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and system
      description: "Android: phone model and Android version (Settings → About phone). Linux: distro, version and desktop."
      placeholder: "RedMagic 8S Pro, Android 13 / Fedora 42, KDE Plasma"
    validations:
      required: true
  - type: checkboxes
    id: setup
    attributes:
      label: Turned on
      options:
        - label: App lock (PIN)
        - label: Fingerprint or face unlock
        - label: Sync with other devices
        - label: Automatic backup
  - type: dropdown
    id: language
    attributes:
      label: App language
      options:
        - English
        - Arabic
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Activity and tap Add
        2. …
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened, and what you expected
      description: If the app showed an error, copy its exact text. On "Couldn't open your data", the second line says why.
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: Screenshots or a screen recording
      description: |
        Drag files here. On Android, turn off **Settings → Security → Private screen** first, or they come out black.
