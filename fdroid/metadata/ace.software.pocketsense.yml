Builds:
  - versionName: 2.2.0
    versionCode: 1016
    commit: v2.2.0
    output: build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
    srclibs:
      - flutter@3.47.5
    prebuild:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - $$flutter$$/bin/flutter config --no-analytics
      - $$flutter$$/bin/flutter pub get
    scandelete:
      - .pub-cache/hosted/pub.dev/sherpa_onnx_android_*/android/src/main/jniLibs
      - .pub-cache/hosted/pub.dev/sherpa_onnx_linux-*/linux
      - .pub-cache/hosted/pub.dev/sherpa_onnx_ios-*/ios
      - .pub-cache/hosted/pub.dev/sherpa_onnx_web-*/assets
      - .pub-cache/hosted/pub.dev/*/example
      - .pub-cache/hosted/pub.dev/*/extension/devtools
      - .pub-cache/hosted/pub.dev/fl_chart-*/build
    build:
      - export PUB_CACHE=$(pwd)/.pub-cache
      - export UNSIGNED_RELEASE=1
      - $$flutter$$/bin/flutter build apk --release --split-per-abi --target-platform=android-arm

